[project]
name = "specflow-contracts"
version = "0.1.0"
description = "Общие доменные модели и Pydantic-схемы сервисов SpecFlow"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specflow_contracts"]
