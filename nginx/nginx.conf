# Reverse-proxy SpecFlow: единая точка входа для фронтенда и API.

# WebSocket-соединения (HMR Vite) требуют заголовка Connection: upgrade,
# для обычных HTTP-запросов — close.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Общие заголовки для всех проксируемых локаций. Задаются на уровне server
    # и наследуются локациями (локации не должны переопределять proxy_set_header,
    # иначе наследование сбрасывается).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Проверка работоспособности самого nginx.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API Gateway.
    location /api/ {
        proxy_pass http://api_gateway:8000;
    }

    # Фронтенд (dev-сервер Vite), включая websocket для HMR.
    location / {
        proxy_pass http://frontend:5173;
    }
}
