name: specflow

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api_gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_HMR_CLIENT_PORT: ${NGINX_PORT:-8000}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  api_gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      API_GATEWAY_CORS_ORIGINS: ${API_GATEWAY_CORS_ORIGINS:-["http://localhost","http://localhost:5173"]}
      API_GATEWAY_ATTRIBUTE_EXTRACTOR_URL: http://attribute_extractor:8001
    depends_on:
      attribute_extractor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import sys, urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2); sys.exit(0)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  attribute_extractor:
    build:
      context: .
      dockerfile: services/attribute_extractor/Dockerfile
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import sys, urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health', timeout=2); sys.exit(0)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
