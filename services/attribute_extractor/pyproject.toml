[project]
name = "attribute-extractor"
version = "0.1.0"
description = "Сервис извлечения атрибутов SpecFlow"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "specflow-contracts",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Семантический VectorIndex (резолв полей). Без него работает лексический fallback.
# torch — CPU-only из pytorch-cpu (см. tool.uv.sources в корне).
embeddings = ["sentence-transformers>=3", "torch>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attribute_extractor"]
